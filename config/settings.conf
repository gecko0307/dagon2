// Main configuration file for Dagon applications

// Logger settings
log.enabled: true;
// Supported log levels: All, Debug, Info, Warning, Error, FatalError
log.level: Debug;
log.toStdout: true;
log.timestampTags: false;
log.levelTags: true;
log.file: "demo.log";

// VFS settings
vfs.appDataFolder: ".dagon2";

// Window settings (used in windowed mode)
window.width: 1280;
window.height: 720;
window.x: auto;
window.y: auto;
window.resizable: true;
window.title: "Dagon Demo";
window.hiDPI: true;
window.HDROutput: false;

// Display settings
fullscreen: false;
vsync: Mailbox; // Off, On, Mailbox
updatesPerSecond: 60;
supersampling: 1;
hideConsole: false;

// Locale settings
// locale: "en_US";

// GPU settings
gpu.debugOutput: true;
gpu.anisotropicFiltering: true;
gpu.defaultTextureAnisotropy: 8;
gpu.shaderCache.enableLogging: false;
gpu.textureCache.enableLogging: false;

// Uncomment to use global cache paths:
// gpu.shaderCache.path: "${appDataPath}/data/shader_cache";
// gpu.textureCache.path: "${appDataPath}/data/texture_cache";
